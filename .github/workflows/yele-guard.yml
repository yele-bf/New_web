name: yele-guard

# Garde-fou « commit ↔ classeur V11 » : voir CONTRIBUTING.md §2 et §5.
# Ne tourne que sur les pull requests → l'historique déjà en place n'est pas jugé.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier le lien commit ↔ classeur V11
        run: |
          python3 scripts/ci/yele_guard.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
